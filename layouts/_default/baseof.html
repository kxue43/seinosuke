<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="{{ site.Home.RelPermalink }}css/main.css">
</head>
<body>
  <header class="site-header">
    <p class="site-title"><a href="{{ site.Home.RelPermalink }}">{{ with site.Home.Params.heading }}{{ . }}{{ else }}{{ site.Title }}{{ end }}</a></p>
    {{ with site.Home.Params.tagline }}<p class="tagline">{{ . }}</p>{{ end }}
    <nav>
      <ul>
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}">{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    <p>&copy; {{ now.Year }} {{ .Site.Title }}</p>
  </footer>
</body>
</html>
